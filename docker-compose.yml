# Laboratório OAuth2/OIDC - ambiente de estudo. NÃO usar em produção.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  resource-api:
      build: ./resource-api
      depends_on:
        - keycloak
      environment:
        OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/seminario
        OIDC_JWKS_URL: http://keycloak:8080/realms/seminario/protocol/openid-connect/certs
        API_AUDIENCE: resource-api
      ports:
        - "5001:5001"
  client-app:
    build: ./client-app
    depends_on:
      - keycloak
      - resource-api
    environment:
      APP_MODE: ${APP_MODE:-vulnerable}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-troque-esta-chave}
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      API_URL: http://resource-api:5001
      REDIRECT_URI: http://localhost:5000/callback
    ports:
      - "5000:5000"
  