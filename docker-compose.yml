# Laboratório OAuth2/OIDC - ambiente de estudo. NÃO usar em produção.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Serviços a serem adicionados nas próximas etapas:
  # client-app:    Flask, porta 5000 (Authorization Code + PKCE)
  # resource-api:  Flask, porta 5001 (endpoints protegidos com RBAC)
  # attacker:      Flask, porta 6666 (servidor do atacante, captura de code/token)