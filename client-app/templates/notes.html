{% extends "base.html" %}
{% block content %}
<h1>Notas</h1>
{% if message %}<p><strong>{{ message }}</strong></p>{% endif %}
<form method="post" action="{{ url_for('notes') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="text" name="text" maxlength="500" placeholder="Nova nota (exige api:write)" required>
    <button type="submit">Criar</button>
</form>
<ul>
    {% for n in notes %}<li>#{{ n.id }}: {{ n.text }}</li>{% else %}<li>Nenhuma nota.</li>{% endfor %}
</ul>
{% endblock %}
